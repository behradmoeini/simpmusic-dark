name: Podcast source probe

on:
  push:
    branches: [podcast-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Search for the two shows
        run: |
          python3 - <<'PY'
          import urllib.parse, subprocess
          for term in ['رختکن بازنده ها', 'عقاید دو دلقک']:
              url = 'https://itunes.apple.com/search?media=podcast&limit=30&term=' + urllib.parse.quote(term)
              out = subprocess.run(['curl', '-sS', '--max-time', '30', '-w', '\nHTTP %{http_code}', '-o', '-', url], capture_output=True, text=True).stdout
              body, _, code = out.rpartition('\nHTTP ')
              import json
              r = json.loads(body).get('results', []) if body.strip() else []
              print(term, code, 'results', len(r))
              for x in r[:4]:
                  print('   ', x.get('collectionName'), '|', 'feed' if x.get('feedUrl') else 'NO FEED')
          PY
      - name: Chart endpoints, three tries each
        run: |
          for u in "https://rss.marketingtools.apple.com/api/v2/us/podcasts/top/50/podcasts.json" "https://itunes.apple.com/us/rss/toppodcasts/limit=50/json"; do
            for i in 1 2 3; do
              code=$(curl -sS --max-time 40 -o /dev/null -w "%{http_code}" "$u" || echo ERR)
              echo "$u try $i: $code"
              [ "$code" = "200" ] && break
              sleep 3
            done
          done
